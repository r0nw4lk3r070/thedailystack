<!-- Article template for The Daily Stack -->
<!-- Coder fills this per article, saves as site/articles/{slug}.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{HEADLINE}} — The Daily Stack</title>
    <style>
        :root {
            --bg:        #0d0d10;
            --surface:   #131316;
            --text:      #e2dcd4;
            --text-dim:  #b0aa9e;
            --accent:    #c4993e;
            --link:      #6aabee;
            --rule:      #232328;
            --rule-mid:  #313138;
            --meta:      #706e6a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.8;
            max-width: 680px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
            font-size: 1.0625rem;
        }

        /* ── Site header ── */
        header {
            padding-bottom: 1.25rem;
            margin-bottom: 2.5rem;
            border-bottom: 1px solid var(--rule-mid);
            display: flex;
            align-items: baseline;
            justify-content: space-between;
        }

        .site-name {
            font-size: 1.05rem;
            font-weight: 400;
            color: var(--text-dim);
            text-decoration: none;
            letter-spacing: 0.01em;
        }

        .site-name em { font-style: italic; color: var(--accent); }
        .site-name:hover { color: var(--text); }

        .site-nav {
            font-size: 0.76rem;
            color: var(--meta);
        }

        .site-nav a { color: var(--meta); text-decoration: none; }
        .site-nav a:hover { color: var(--link); }

        /* ── Article head ── */
        article h1 {
            font-size: 2.1rem;
            font-weight: 400;
            line-height: 1.25;
            letter-spacing: 0.005em;
            margin-bottom: 0.75rem;
            color: var(--text);
        }

        article h1 em { font-style: italic; }

        article .byline {
            color: var(--meta);
            font-size: 0.76rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }

        .byline-rule {
            height: 1px;
            background: linear-gradient(to right, var(--accent) 0%, var(--rule-mid) 40%, transparent 100%);
            margin: 0.9rem 0 2rem;
        }

        /* ── Body text ── */
        article p { margin-bottom: 1.3rem; }

        /* Drop cap on the very first paragraph */
        article > p:first-of-type::first-letter {
            float: left;
            font-size: 3.85rem;
            line-height: 0.78;
            padding-right: 0.1em;
            padding-top: 0.07em;
            color: var(--accent);
        }

        article h2 {
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 0.04em;
            margin: 2.75rem 0 0.9rem;
            color: var(--text-dim);
            border-bottom: 1px solid var(--rule);
            padding-bottom: 0.4rem;
        }

        article strong { color: var(--text); }

        article em { font-style: italic; }

        article blockquote {
            margin: 2rem 0;
            padding: 0.6rem 1.4rem;
            border-left: 3px solid var(--accent);
            color: var(--text-dim);
            font-style: italic;
            font-size: 1.05rem;
            line-height: 1.7;
        }

        article blockquote cite {
            display: block;
            font-style: normal;
            color: var(--meta);
            font-size: 0.8rem;
            margin-top: 0.5rem;
        }

        article hr {
            border: none;
            border-top: 1px solid var(--rule);
            margin: 2.5rem 0;
        }

        article ul, article ol {
            margin: 0.75rem 0 1.3rem 1.6rem;
        }

        article li { margin-bottom: 0.4rem; }

        article a { color: var(--link); text-decoration: none; }
        article a:hover { text-decoration: underline; }

        /* ── Sources ── */
        article .sources {
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--rule);
            font-size: 0.82rem;
            color: var(--meta);
        }

        article .sources h2 {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent);
            border: none;
            padding: 0;
            margin: 0 0 0.75rem;
        }

        article .sources ol { margin-left: 1.5rem; }
        article .sources li { margin-bottom: 0.3rem; }
        article .sources a { color: var(--text-dim); }
        article .sources a:hover { color: var(--link); }

        /* ── Series footer ── */
        .series-footer {
            margin-top: 2rem;
            padding: 1.1rem 1.5rem;
            border: 1px solid var(--rule-mid);
            border-left: 3px solid var(--accent);
            font-style: italic;
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        .series-footer a { color: var(--link); }

        /* ── Footer ── */
        footer {
            margin-top: 3rem;
            padding-top: 1.2rem;
            border-top: 1px solid var(--rule);
            color: var(--meta);
            font-size: 0.76rem;
        }

        footer a { color: var(--text-dim); text-decoration: none; }
        footer a:hover { color: var(--link); }
    </style>
</head>
<body>
    <header>
        <a class="site-name" href="../">The <em>Daily</em> Stack</a>
        <nav class="site-nav"><a href="../">← Index</a></nav>
    </header>

    <article>
        <h1>{{HEADLINE}}</h1>
        <div class="byline">{{DATE}} &middot; {{TYPE}} &middot; {{READING_TIME}} min read</div>
        <div class="byline-rule"></div>

        {{BODY}}

        <div class="sources">
            <h2>Sources</h2>
            <ol>
                {{SOURCES}}
            </ol>
        </div>

        {{SERIES_FOOTER}}
    </article>

    <footer>
        <a href="../">Back to index</a> &middot;
        The Daily Stack &mdash; an editorial agent by <a href="https://ronspoelstra.be">ronspoelstra.be</a>
    </footer>
</body>
</html>
